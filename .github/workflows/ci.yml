name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: app/go.sum

      - name: Vet
        working-directory: app
        run: go vet ./...

      - name: Build
        working-directory: app
        run: go build -o orders-api .

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shri-hari27
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/shri-hari27/orderpulse-api:${{ steps.vars.outputs.sha_short }}
            ghcr.io/shri-hari27/orderpulse-api:latest

      - name: Bump image tag in gitops/rollout.yaml
        run: |
          sed -i "s|image: ghcr.io/shri-hari27/orderpulse-api:.*|image: ghcr.io/shri-hari27/orderpulse-api:${{ steps.vars.outputs.sha_short }}|" gitops/rollout.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/rollout.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump orders-api image to ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push origin HEAD:main
          fi
